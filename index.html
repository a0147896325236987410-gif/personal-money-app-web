<script>
// 把錯誤直接印在畫面上，不用接電腦看 console
function showErr(title, detail) {
  var e = document.getElementById("err");
  e.style.display = "block";
  e.innerHTML = "<h3>" + title + "</h3><pre>" + String(detail).replace(/</g, "&lt;") + "</pre>" +
    "<button onclick=\"location.reload()\">重新載入</button>";
  var r = document.getElementById("root");
  if (r) r.innerHTML = "";
}
window.onerror = function (msg, src, line, col, err) {
  showErr("程式出錯了", msg + "\n\n位置 " + (line || "?") + ":" + (col || "?") + (err && err.stack ? "\n\n" + err.stack.slice(0, 600) : ""));
  return true;
};
window.addEventListener("unhandledrejection", function (ev) {
  showErr("非同步錯誤", ev.reason && ev.reason.message ? ev.reason.message : ev.reason);
});
// 8 秒還沒渲染出東西就提示
setTimeout(function () {
  var r = document.getElementById("root");
  if (r && r.querySelector(".boot")) {
    showErr("載入逾時", "React 或 Babel 沒載入成功。\n\n多半是網路問題：第一次開啟需要連上網路下載函式庫。\n連上網路後按重新載入。");
  }
}, 8000);
</script>

// ── v39 Google 試算表雲端同步 ──
// 讀取使用 JSONP，避開 Apps Script ContentService 的跨網域限制；寫入用 simple POST + no-cors。
// API URL / Token 只存在這個網站的 localStorage，不會寫進公開原始碼。
const CLOUD_URL_KEY = "money_cloud_api_url_v1";
const CLOUD_TOKEN_KEY = "money_cloud_api_token_v1";
let cloudSaveTimer = null;

const cloudConfig = () => {
  try {
    return {
      url: (localStorage.getItem(CLOUD_URL_KEY) || "").trim(),
      token: (localStorage.getItem(CLOUD_TOKEN_KEY) || "").trim(),
    };
  } catch (e) { return { url: "", token: "" }; }
};
const saveCloudConfig = (url, token) => {
  try {
    localStorage.setItem(CLOUD_URL_KEY, String(url || "").trim());
    localStorage.setItem(CLOUD_TOKEN_KEY, String(token || "").trim());
  } catch (e) {}
};
const clearCloudConfig = () => {
  try { localStorage.removeItem(CLOUD_URL_KEY); localStorage.removeItem(CLOUD_TOKEN_KEY); } catch (e) {}
};
const touchSync = (state) => ({
  ...state,
  sync: { ...(state?.sync || {}), updatedAt: new Date().toISOString() },
});
const tsOf = (s) => {
  const n = Date.parse(s || "");
  return Number.isFinite(n) ? n : 0;
};

const cloudJsonp = (action = "load", timeoutMs = 12000) => new Promise((resolve, reject) => {
  const cfg = cloudConfig();
  if (!cfg.url || !cfg.token) return reject(new Error("雲端尚未設定"));
  let u;
  try { u = new URL(cfg.url); } catch (e) { return reject(new Error("API 網址格式不正確")); }
  const cb = "__moneyCloudCb" + Date.now() + Math.floor(Math.random() * 100000);
  let done = false;
  const script = document.createElement("script");
  const cleanup = () => {
    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
    try { script.remove(); } catch (e) {}
  };
  const timer = setTimeout(() => {
    if (done) return;
    done = true; cleanup(); reject(new Error("雲端連線逾時"));
  }, timeoutMs);
  window[cb] = (payload) => {
    if (done) return;
    done = true; clearTimeout(timer); cleanup();
    if (!payload?.ok) reject(new Error(payload?.error || "雲端回傳錯誤"));
    else resolve(payload);
  };
  u.searchParams.set("action", action);
  u.searchParams.set("token", cfg.token);
  u.searchParams.set("callback", cb);
  u.searchParams.set("_", String(Date.now()));
  script.async = true;
  script.onerror = () => {
    if (done) return;
    done = true; clearTimeout(timer); cleanup(); reject(new Error("雲端讀取失敗"));
  };
  script.src = u.toString();
  document.head.appendChild(script);
});

const cloudPost = async (state) => {
  const cfg = cloudConfig();
  if (!cfg.url || !cfg.token) throw new Error("雲端尚未設定");
  const body = new URLSearchParams();
  body.set("action", "save");
  body.set("token", cfg.token);
  body.set("clientRev", String(Number(state?.sync?.rev || 0)));
  body.set("clientUpdatedAt", state?.sync?.updatedAt || new Date().toISOString());
  body.set("state", JSON.stringify(state));
  await fetch(cfg.url, { method: "POST", mode: "no-cors", body });
};

const scheduleCloudPush = (state, setStatus, delay = 850) => {
  const cfg = cloudConfig();
  if (!cfg.url || !cfg.token) {
    setStatus?.({ state: "off", text: "尚未設定 Google 試算表同步", at: "" });
    return;
  }
  if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
  setStatus?.({ state: "pending", text: "等待同步…", at: "" });
  cloudSaveTimer = setTimeout(async () => {
    try {
      setStatus?.({ state: "syncing", text: "同步中…", at: "" });
      await cloudPost(state);
      const check = await cloudJsonp("load", 15000);
      const localAt = state?.sync?.updatedAt || "";
      const remoteAt = check?.updatedAt || check?.state?.sync?.updatedAt || "";
      if (check?.state && remoteAt !== localAt) {
        throw new Error("雲端版本與本機不同，已停止覆蓋；請先從雲端下載並確認差異");
      }
      setStatus?.({ state: "synced", text: "已同步", at: remoteAt || localAt });
    } catch (e) {
      setStatus?.({ state: "error", text: e?.message || "同步失敗", at: "" });
    }
  }, Math.max(0, delay));
};

const quickAddFromUrl = (base) => {
  try {
    const q = new URLSearchParams(window.location.search);
    if (q.get("quick") !== "1") return { data: base, added: false };

    const text = (q.get("text") || "").trim();
    const textAmount = text.match(/(?:^|\s|\$|＄)(\d[\d,]*(?:\.\d+)?)(?:\s|元|塊|$)/)?.[1]
      || text.match(/(\d[\d,]*(?:\.\d+)?)/)?.[1];
    const amount = Number(String(q.get("amount") || textAmount || "").replace(/,/g, ""));
    if (!(amount > 0)) return { data: base, added: false, message: "快速記帳失敗：我沒抓到金額" };

    const rawKind = q.get("kind") || (text.includes("共同") ? "shared" : text.includes("收入") || text.includes("薪水") || text.includes("獎金") ? "income" : "expense");
    const k0 = rawKind.toLowerCase();
    const kind = ({ expense: "expense", income: "income", shared: "shared", "支出": "expense", "收入": "income", "共同": "shared" })[k0] || "expense";

    const methodAliases = { "現金": "c1", "國泰卡": "c_cathay", "富邦卡": "c_fubon", "國泰": "c_cathay", "富邦": "c_fubon", "國泰主帳戶": "c2", "主帳戶": "c2", "玉山": "c4" };
    const detectedMethod = Object.keys(methodAliases).sort((a, b) => b.length - a.length).find((x) => text.includes(x));
    const methodRaw = q.get("method") || detectedMethod || (kind === "income" ? "c2" : "c1");
    const byName = base.cash.find((c) => c.name === methodRaw)?.id;
    const method = byName || methodAliases[methodRaw] || methodRaw;
    const validMethod = isCard(method) || base.cash.some((c) => c.id === method);
    const finalMethod = validMethod ? method : (kind === "income" ? "c2" : "c1");

    let autoCat = "";
    if (kind === "income") autoCat = /底薪|薪水/.test(text) ? "base" : /獎金|佣金|成交/.test(text) ? "bonus" : "other_in";
    else if (kind === "shared") autoCat = /旅遊|飯店|機票/.test(text) ? "s_trip" : /禮物/.test(text) ? "s_gift" : /約會|電影/.test(text) ? "s_date" : /生活|日用|家用/.test(text) ? "s_life" : /吃|餐|飯|咖啡|飲料|宵夜|早餐|午餐|晚餐/.test(text) ? "s_food" : "s_other";
    else autoCat = /加油|停車|計程車|捷運|高鐵|火車|交通/.test(text) ? "car"
      : /貓|狗|寵物|飼料|罐頭|獸醫/.test(text) ? "pet"
      : /購物|衣服|鞋|蝦皮|網購/.test(text) ? "shop"
      : /遊戲|電影|娛樂|唱歌|KTV/.test(text) ? "fun"
      : /紅包|送禮|人情/.test(text) ? "social"
      : /日用|衛生紙|洗髮|生活/.test(text) ? "life"
      : /吃|餐|飯|咖啡|飲料|宵夜|早餐|午餐|晚餐/.test(text) ? "food" : "other";

    const catRaw = q.get("cat") || "";
    const cat = CAT_ALIASES[catRaw] || catRaw || autoCat;
    const dateRaw = q.get("date") || "";
    const date = /^\d{4}-\d{2}-\d{2}$/.test(dateRaw) ? dateRaw : today();

    let note = (q.get("note") || "").trim();
    if (!note && text) {
      note = text
        .replace(String(textAmount || ""), " ")
        .replace(/元|塊/g, " ")
        .replace(/共同|支出|收入/g, " ");
      Object.keys(methodAliases).sort((a, b) => b.length - a.length).forEach((x) => { note = note.replaceAll(x, " "); });
      note = note.replace(/\s+/g, " ").trim();
    }

    const id = (kind === "shared" ? "sq" : "tq") + Date.now();
    const cash = adjust(base.cash, finalMethod, kind === "income" ? amount : -amount);
    const data = kind === "shared"
      ? { ...base, cash, sharedTx: [{ id, amount, cat, method: finalMethod, date, note, settled: false, settledAmount: 0 }, ...(base.sharedTx || [])] }
      : { ...base, cash, tx: [{ id, kind, amount, cat, method: finalMethod, date, note }, ...(base.tx || [])] };
    const kindName = kind === "income" ? "收入" : kind === "shared" ? "共同" : "支出";
    return { data, added: true, kind, date, message: `已記帳 · ${kindName} ${nf(amount)}${note ? ` · ${note}` : ""}` };
  } catch (e) {
    return { data: base, added: false, message: "快速記帳失敗" };
  }
};

function Num({ value, onChange, dec = 0, suffix = "", color, size = 15 }) {
  const [e, setE] = useState(false);
  const [t, setT] = useState("");
  const commit = () => { const v = parseFloat(t.replace(/,/g, "")); if (!isNaN(v)) onChange(v); setE(false); };
  if (e) return (
    <input autoFocus value={t} onChange={(ev) => setT(ev.target.value)} onBlur={commit}
      onKeyDown={(ev) => ev.key === "Enter" && commit()} inputMode="decimal"
      style={{ width: 112, background: C.bg, border: `1px solid ${C.ink}`, borderRadius: 5, color: C.text,
        fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif", fontSize: size, padding: "3px 7px", textAlign: "right", outline: "none" }} />
  );
  return (
    <button onClick={() => { setT(String(value)); setE(true); }}
      style={{ background: "none", border: "none", borderBottom: `1px dotted ${C.line}`, color: color || C.text,
        fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif", fontSize: size, padding: "1px 0", cursor: "pointer" }}>
      {nf(value, dec)}{suffix}
    </button>
  );
}

function Donut({ data, center, sub, size = 128, thickness = 23 }) {
  const total = data.reduce((a, x) => a + x.v, 0) || 1;
  const r = (size - thickness) / 2, c = size / 2, circ = 2 * Math.PI * r;
  let acc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ flexShrink: 0 }}>
      <g transform={`rotate(-90 ${c} ${c})`}>
        <circle cx={c} cy={c} r={r} fill="none" stroke={C.bg} strokeWidth={thickness} />
        {data.map((x) => {
          const frac = x.v / total;
          const seg = (
            <circle key={x.k} cx={c} cy={c} r={r} fill="none" stroke={x.color} strokeWidth={thickness}
              strokeDasharray={`${Math.max(0, circ * frac - 2)} ${circ}`} strokeDashoffset={-circ * acc} />
          );
          acc += frac;
          return seg;
        })}
      </g>
      <text x={c} y={c - 2} textAnchor="middle" style={{ fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang TC','Noto Sans TC',sans-serif", fontWeight: 800, fontSize: 16, fill: C.text }}>{center}</text>
      <text x={c} y={c + 13} textAnchor="middle" style={{ fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif", fontSize: 9, fill: C.dim }}>{sub}</text>
    </svg>
  );
}

function Trend({ snaps }) {
  const W = 340, H = 170, P = { l: 42, r: 10, t: 12, b: 24 };
  if (!snaps || snaps.length < 2)
    return (
      <div style={{ padding: "28px 4px", textAlign: "center", color: C.dim, fontSize: 12.5, lineHeight: 1.8 }}>
        今天是第一筆紀錄。<br />每天開一次 app 就會自動記，兩天後開始出現曲線。
      </div>
    );
  const vals = snaps.flatMap((s) => [s.net, s.debt]);
  const lo = Math.min(...vals), hi = Math.max(...vals), rg = hi - lo || 1;
  const X = (i) => P.l + (i / (snaps.length - 1)) * (W - P.l - P.r);
  const Y = (v) => P.t + (1 - (v - lo) / rg) * (H - P.t - P.b);
  const path = (k) => snaps.map((s, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(s[k]).toFixed(1)}`).join(" ");
  const ticks = [lo, lo + rg / 2, hi];
  const idx = snaps.length <= 4 ? snaps.map((_, i) => i) : [0, Math.floor(snaps.length / 3), Math.floor((snaps.length * 2) / 3), snaps.length - 1];
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: "block" }}>
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={P.l} x2={W - P.r} y1={Y(t)} y2={Y(t)} stroke={C.line} strokeWidth="1" />
          <text x={P.l - 6} y={Y(t) + 3.5} textAnchor="end" style={{ fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif", fontSize: 8.5, fill: C.dim }}>
            {Math.round(t / 1000)}k
          </text>
        </g>
      ))}
      <path d={path("debt")} fill="none" stroke={C.amber} strokeWidth="2" strokeDasharray="4 3" strokeLinejoin="round" />
      <path d={path("net")} fill="none" stroke={C.ink} strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round" />
      {idx.map((i) => (
        <text key={i} x={X(i)} y={H - 6} textAnchor="middle" style={{ fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif", fontSize: 8.5, fill: C.dim }}>
          {snaps[i].date.slice(5).replace("-", "/")}
        </text>
      ))}
    </svg>
  );
}

function Legend({ data }) {
  return (
    <div style={{ flex: 1, minWidth: 0 }}>
      {data.map((x) => (
        <div key={x.k} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0", fontSize: 12.5 }}>
          <div style={{ width: 8, height: 8, borderRadius: 2, background: x.color, flexShrink: 0 }} />
          <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{x.n}</span>
          <span style={{ color: C.dim, fontSize: 11 }}>{nf(x.v)}</span>
          <span style={{ width: 44, textAlign: "right" }}>{nf(x.pct, 1)}%</span>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [d, setD] = useState(DEFAULT);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("ledger");
  const [month, setMonth] = useState(ym(today()));
  const [sheet, setSheet] = useState(false);
  const [editId, setEditId] = useState(null);
  const [kind, setKind] = useState("expense");
  const [f, setF] = useState({ amount: "", cat: "food", method: "c1", date: today(), note: "" });
  const [modal, setModal] = useState(null);
  const [px, setPx] = useState({ busy: false, err: null });
  const [search, setSearch] = useState({ q: "", busy: false, hits: [] });
  const [quickMsg, setQuickMsg] = useState(null);
  const [syncStatus, setSyncStatus] = useState(() => cloudConfig().url && cloudConfig().token ? { state: "idle", text: "準備同步", at: "" } : { state: "off", text: "尚未設定 Google 試算表同步", at: "" });

  useEffect(() => {
    (async () => {
      let next = migrateState(DEFAULT);
      try {
        const raw = await readBook();
        if (raw) {
          const parsed = JSON.parse(raw);
          next = migrateState(parsed);
          if (Number(parsed?.v || 0) !== DEFAULT.v) await writeBook(next);
        }
      } catch (e) {}

      // 若已設定雲端：開 App 時先比較本機與雲端更新時間，較新的那份勝出。
      const cfg = cloudConfig();
      if (cfg.url && cfg.token) {
        setSyncStatus({ state: "syncing", text: "讀取雲端…", at: "" });
        try {
          const remote = await cloudJsonp("load");
          if (remote?.state) {
            const cloudState = migrateState(remote.state);
            const remoteAt = remote.updatedAt || cloudState.sync?.updatedAt || "";
            const localAt = next.sync?.updatedAt || "";
            if (!localAt || tsOf(remoteAt) >= tsOf(localAt)) {
              next = { ...cloudState, sync: { ...(cloudState.sync || {}), rev: Number(remote.rev || cloudState.sync?.rev || 0), updatedAt: remoteAt } };
              await writeBook(next);
            } else {
              scheduleCloudPush(next, setSyncStatus, 0);
            }
            setSyncStatus({ state: "synced", text: "已連上 Google 試算表", at: remoteAt || localAt });
          } else {
            // 第一次串接時，雲端還沒有 state，使用手機現有資料當第一份雲端資料。
            next = touchSync(next);
            await writeBook(next);
            scheduleCloudPush(next, setSyncStatus, 0);
          }
        } catch (e) {
          setSyncStatus({ state: "error", text: e?.message || "雲端讀取失敗，先用手機資料", at: "" });
        }
      }

      const quick = quickAddFromUrl(next);
      next = quick.data;
      if (quick.added) next = migrateState(touchSync(next));
      setD(next);
      if (quick.added) {
        await writeBook(next);
        scheduleCloudPush(next, setSyncStatus);
        setTab(quick.kind === "shared" ? "shared" : "ledger");
        setMonth(ym(quick.date));
      }
      if (quick.message) {
        setQuickMsg(quick.message);
        setTimeout(() => setQuickMsg(null), 3600);
      }
      if (window.location.search) {
        try { window.history.replaceState({}, "", window.location.pathname + window.location.hash); } catch (e) {}
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => { if (loaded) fetchPx(); }, [loaded]);

  // 依目前持倉動態組出要抓的幣種
  const fetchPx = async (base) => {
    const data = base || d;
    const ids = [...new Set([...data.spot, ...data.collateral, ...(data.bots || [])].map((x) => x.cg).filter(Boolean).concat("tether"))];
    setPx({ busy: true, err: null });
    try {
      const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids.join(",")}&vs_currencies=usd,twd`);
      if (!r.ok) throw new Error();
      const j = await r.json();
      const nextPx = { ...data.px };
      [...data.spot, ...data.collateral, ...(data.bots || [])].forEach((x) => {
        if (x.cg && j[x.cg]?.usd != null) nextPx[x.sym] = j[x.cg].usd;
      });
      save({ ...data, px: nextPx, fx: j.tether?.twd ?? data.fx, pxAt: new Date().toISOString() });
      setPx({ busy: false, err: null });
    } catch (e) {
      setPx({ busy: false, err: "抓不到價格，沿用上次的" });
    }
  };

  const searchCoin = async (q) => {
    if (!q || q.length < 2) return setSearch((p) => ({ ...p, hits: [] }));
    setSearch((p) => ({ ...p, busy: true }));
    try {
      const r = await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(q)}`);
      const j = await r.json();
      setSearch({ q, busy: false, hits: (j.coins || []).slice(0, 8) });
    } catch (e) {
      setSearch({ q, busy: false, hits: [] });
    }
  };

  const save = async (next) => {
    const clean = migrateState(touchSync(next));
    setD(clean);
    await writeBook(clean);
    scheduleCloudPush(clean, setSyncStatus);
  };
  const patch = (p, id, k, v) => save({ ...d, [p]: d[p].map((x) => (x.id === id ? { ...x, [k]: v } : x)) });

  const syncNow = async () => {
    const cfg = cloudConfig();
    if (!cfg.url || !cfg.token) {
      setModal({ type: "cloud", ...cfg, result: "" });
      return;
    }
    const clean = migrateState(touchSync(d));
    setD(clean);
    await writeBook(clean);
    scheduleCloudPush(clean, setSyncStatus, 0);
  };

  const pullCloudNow = async () => {
    try {
      setSyncStatus({ state: "syncing", text: "下載雲端資料…", at: "" });
      const remote = await cloudJsonp("load");
      if (!remote?.state) throw new Error("雲端還沒有資料");
      const clean = migrateState({ ...remote.state, sync: { ...(remote.state.sync || {}), rev: Number(remote.rev || 0), updatedAt: remote.updatedAt || remote.state.sync?.updatedAt || "" } });
      setD(clean);
      await writeBook(clean);
      setSyncStatus({ state: "synced", text: "已從雲端下載", at: remote.updatedAt || "" });
      return true;
    } catch (e) {
      setSyncStatus({ state: "error", text: e?.message || "下載失敗", at: "" });
      return false;
    }
  };

  // ── 共用計算 ──
  // 可用來付錢的帳戶：排除卡費專戶與共同基金
  const payAccts = d.cash.filter((c) => !c.excluded && !c.earmark);
  const methods = [...payAccts.map((c) => ({ k: c.id, n: c.name, card: false, amt: c.amt, cur: c.cur })), ...CARDS.map((c) => ({ ...c, card: true }))];
  const mName = (k) => d.cash.find((c) => c.id === k)?.name || CARDS.find((c) => c.k === k)?.n || { cash: "現金", cathay: "國泰", esun: "玉山" }[k] || k;

  // 轉帳端點：TWD 帳戶 + 幣安 / 派網 U 餘額。轉帳本身不列收入支出。
  const transferAccounts = [
    ...d.cash.filter((c) => !c.excluded && c.cur === "TWD").map((c) => ({ id: c.id, name: c.name, unit: "TWD", balance: Number(c.amt || 0), kind: "bank" })),
    ...(d.exchanges || []).map((x) => ({ id: x.id, name: x.name, unit: "U", balance: Number(x.u || 0), kind: "exchange" })),
  ];
  const transferAcct = (id) => transferAccounts.find((x) => x.id === id);
  const transferName = (id) => transferAcct(id)?.name || id;
  const transferUnit = (id) => transferAcct(id)?.unit || "";
  const transferBalance = (id) => transferAcct(id)?.balance || 0;
  const accountReferenceCount = (id) =>
    d.tx.filter((x) => x.method === id || x.payFrom === id).length
    + (d.sharedTx || []).filter((x) => x.method === id).length
    + (d.transfers || []).filter((x) => x.from === id || x.to === id).length;
  const accountDeleteReason = (account) => {
    if (!account) return "找不到帳戶";
    if (SYSTEM_CASH_IDS.has(account.id)) return "系統帳戶只能編輯，不能刪除";
    if (Math.abs(Number(account.amt || 0)) > 0.001) return "請先把帳戶餘額調整為 0";
    if (accountReferenceCount(account.id) > 0) return "這個帳戶已有歷史帳目，為了保留對帳關係不能刪除";
    return "";
  };

  const price = (s) => (s === "USDT" ? 1 : d.px[s] || 0);
  const t2 = (u) => u * d.fx;
  const due = (mk) => d.openCard[mk]
    + d.tx.filter((t) => t.kind === "expense" && t.method === mk).reduce((a, t) => a + t.amount, 0)
    + (d.sharedTx || []).filter((t) => t.method === mk).reduce((a, t) => a + t.amount, 0)
    - d.tx.filter((t) => t.kind === "payment" && t.method === mk).reduce((a, t) => a + paymentCardAmount(t), 0);

  // 分期由 nextDue 驅動：繳掉一期就真的扣本金、扣期數，下一期會自動排到下個月。
  const cardInstallments = (d.loans || []).filter((x) => x.type === "card_installment" || x.card);
  const dueCyclesFor = (x) => {
    if (!(Number(x.amt || 0) > 0) || !x.nextDue || !(Number(x.monthly || 0) > 0)) return 0;
    const diff = monthDiff(x.nextDue, today());
    if (diff < 0) return 0;
    return Math.min(Number(x.remainingPeriods || Math.ceil(Number(x.amt || 0) / Number(x.monthly || 1))), diff + 1);
  };
  const installmentDueFor = (x) => Math.min(Number(x.amt || 0), dueCyclesFor(x) * Number(x.monthly || 0));
  const cardInstDue = (mk) => cardInstallments.filter((x) => (x.card || "c_cathay") === mk).reduce((a, x) => a + installmentDueFor(x), 0);
  const instDue = cardInstDue("c_cathay") + cardInstDue("c_fubon");
  const payableCard = (mk) => Math.max(0, due(mk)) + cardInstDue(mk);
  const totalDue = payableCard("c_cathay") + payableCard("c_fubon");
  // 你習慣先把卡費錢隔離起來，因此本期繳完後，下一期分期會立刻進「準備金目標」。
  const nextInstallmentReserve = cardInstallments.reduce((a, x) => {
    if (!(Number(x.amt || 0) > 0) || installmentDueFor(x) > 0) return a;
    return a + Math.min(Number(x.monthly || 0), Number(x.amt || 0));
  }, 0);
  const cardReserveTarget = totalDue + nextInstallmentReserve;
  const payAcct = d.cash.find((c) => c.earmark);
  const gap = cardReserveTarget - (payAcct?.amt || 0);

  const fund = d.cash.find((c) => c.excluded);
  const stx = (d.sharedTx || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  const owed = stx.reduce((a, t) => a + sharedRemaining(t), 0);
  const unsettledCount = stx.filter((t) => sharedRemaining(t) > 0.001).length;
  // 墊付的錢會從共同基金拿回來，算應收，不然淨資產會被低估
  const cashTWD = d.cash.filter((x) => !x.excluded).reduce((a, x) => a + (x.cur === "USD" ? t2(x.amt) : x.amt), 0) + owed;
  const exchangeUSD = (d.exchanges || []).reduce((a, x) => a + Number(x.u || 0), 0);
  const spotUSD = d.spot.reduce((a, x) => a + x.qty * price(x.sym), 0);
  const botValueUSD = (x) => x.mode === "coin" ? Number(x.qty || 0) * price(x.sym) : Number(x.valueUSD || 0);
  const botsUSD = (d.bots || []).reduce((a, x) => a + botValueUSD(x), 0);
  const collGross = d.collateral.reduce((a, x) => a + x.qty * price(x.sym), 0);
  const pledgeUSD = d.collateral.reduce((a, x) => a + (x.borrow || 0), 0);
  const collNet = collGross - pledgeUSD;
  const legacyInvTWD = t2(exchangeUSD + spotUSD + botsUSD + collNet);
  const portfolioRows = (d.portfolioAssets || []).map((x, i) => {
    const qty = Math.max(0, Number(x.qty || 0));
    const currentPrice = Math.max(0, Number(x.price || 0));
    const avgCost = Math.max(0, Number(x.cost || 0));
    const currency = String(x.cur || "TWD").toUpperCase();
    const fxRate = currency === "TWD" ? 1 : Number(d.fx || 0);
    const valueTWD = qty * currentPrice * fxRate;
    const costTWD = qty * avgCost * fxRate;
    const pnlTWD = valueTWD - costTWD;
    return { ...x, qty, currentPrice, avgCost, currency, valueTWD, costTWD, pnlTWD, color: assetType(x.assetClass).c || PALETTE[i % PALETTE.length] };
  }).sort((a, b) => b.valueTWD - a.valueTWD);
  const includedPortfolioRows = portfolioRows.filter((x) => x.included !== false);
  const customInvTWD = includedPortfolioRows.reduce((a, x) => a + x.valueTWD, 0);
  const knownCostRows = includedPortfolioRows.filter((x) => x.costTWD > 0);
  const customPnlTWD = knownCostRows.reduce((a, x) => a + x.pnlTWD, 0);
  const invTWD = legacyInvTWD + customInvTWD;
  // 卡分期中已列入「應付卡費」的部分，不再重複算進貸款本金。
  const loanTWD = Math.max(0, d.loans.reduce((a, x) => a + (x.cur === "USD" ? t2(x.amt) : x.amt), 0) - instDue);
  const biz = d.biz || { invested: 0, recovered: 0, profit: 0, log: [] };
  const bizOut = Number(biz.invested || 0) - Number(biz.recovered || 0);
  // 卡牌事業獨立管理，不計入個人總資產或淨資產。
  const assetTWD = cashTWD + invTWD;
  const net = assetTWD - loanTWD - totalDue;
  // 槓桿比例用毛額當分母，質押借款也是真的借來的錢
  const grossTWD = cashTWD + t2(exchangeUSD + spotUSD + botsUSD + collGross) + customInvTWD;
  const borrowTotal = loanTWD + t2(pledgeUSD);
  const borrowedPct = grossTWD > 0 ? (borrowTotal / grossTWD) * 100 : 0;
  const yearInt =
    d.loans.reduce((a, x) => a + ((x.cur === "USD" ? t2(x.amt) : x.amt) * x.rate) / 100, 0) +
    d.collateral.reduce((a, x) => a + (t2(x.borrow || 0) * (x.rate || 0)) / 100, 0);
  const ltvOf = (c) => { const v = c.qty * price(c.sym); return v > 0 ? ((c.borrow || 0) / v) * 100 : 0; };

  // 持倉合併（現貨 + 理財抵押，同幣種相加）
  const holdMap = {};
  [...d.spot, ...d.collateral].forEach((x) => { holdMap[x.sym] = (holdMap[x.sym] || 0) + x.qty * price(x.sym); });
  if (exchangeUSD > 0) holdMap.USDT = (holdMap.USDT || 0) + exchangeUSD;
  (d.bots || []).forEach((x) => {
    const k = x.mode === "coin" ? x.sym : `${x.sym} 網格`;
    holdMap[k] = (holdMap[k] || 0) + botValueUSD(x);
  });
  const holdTot = Object.values(holdMap).reduce((a, b) => a + b, 0);
  const holdings = Object.entries(holdMap)
    .map(([sym, v]) => ({ sym, v, pct: holdTot ? (v / holdTot) * 100 : 0 }))
    .sort((a, b) => b.v - a.v);
  const riskPct = holdTot ? ((holdTot - (holdMap.USDT || 0)) / holdTot) * 100 : 0;
  const allocationRows = [
    ...includedPortfolioRows.map((x) => ({ k: x.id, n: x.name, color: x.color, v: x.valueTWD })),
    ...(legacyInvTWD > 0 ? [{ k: "legacy-crypto", n: "Crypto／交易所", color: C.teal, v: legacyInvTWD }] : []),
  ].sort((a, b) => b.v - a.v);
  const allocationTotal = allocationRows.reduce((a, x) => a + x.v, 0);
  const allocationLegend = allocationRows.map((x) => ({ ...x, pct: allocationTotal > 0 ? x.v / allocationTotal * 100 : 0 }));
  const portfolioGroups = [...new Set(portfolioRows.map((x) => String(x.group || "未分組").trim() || "未分組"))];

  const smtx = stx.filter((t) => ym(t.date) === month);
  const sSpent = smtx.reduce((a, t) => a + t.amount, 0);
  const sByCat = SHARED_CATS.map((c) => ({ ...c, v: smtx.filter((t) => t.cat === c.k).reduce((a, t) => a + t.amount, 0) })).filter((c) => c.v > 0).sort((a, b) => b.v - a.v);

  const months = [...new Set([month, ...d.tx.map((t) => ym(t.date)), ...(d.transfers || []).map((t) => ym(t.date)), ...(d.sharedTx || []).map((t) => ym(t.date))])].sort().reverse();
  const mtx = d.tx.filter((t) => ym(t.date) === month).sort((a, b) => b.date.localeCompare(a.date));
  const mTransfers = (d.transfers || []).filter((t) => ym(t.date) === month).sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
  const spent = mtx.filter((t) => t.kind === "expense").reduce((a, t) => a + t.amount, 0);
  const earned = mtx.filter((t) => t.kind === "income").reduce((a, t) => a + t.amount, 0);
  const byCat = CATS.map((c) => ({ ...c, v: mtx.filter((t) => t.kind === "expense" && t.cat === c.k).reduce((a, t) => a + t.amount, 0) }))
    .filter((c) => c.v > 0).sort((a, b) => b.v - a.v);

  const cardSpent = mtx.filter((t) => t.kind === "expense" && isCard(t.method)).reduce((a, t) => a + t.amount, 0);
  const activeLoanMonthly = (d.loans || []).filter((x) => Number(x.amt || 0) > 0).reduce((a, x) => a + Number(x.monthly || 0), 0);
  const fixedOut = activeLoanMonthly;
  const outRate = earned > 0 ? (spent / earned) * 100 : null;
  const loanRate = earned > 0 ? (fixedOut / earned) * 100 : null;
  const cardRate = spent > 0 ? (cardSpent / spent) * 100 : 0;
  const personalLoan = (d.loans || []).find((x) => x.type === "personal_loan" || x.id === "l1");
  const loanDueCycles = personalLoan ? dueCyclesFor(personalLoan) : 0;
  const loanDueNow = personalLoan ? Math.min(Number(personalLoan.amt || 0), loanDueCycles * Number(personalLoan.monthly || 0)) : 0;
  const pchomeInst = cardInstallments.find((x) => x.id === "l2") || cardInstallments[0];
  const openDebtEditor = () => setModal({
    type: "editDebt",
    cathayDue: String(Math.round(Math.max(0, due("c_cathay")))),
    fubonDue: String(Math.round(Math.max(0, due("c_fubon")))),
    instAmt: String(Math.round(Number(pchomeInst?.amt || 0))),
    instPeriods: String(Math.max(0, Math.round(Number(pchomeInst?.remainingPeriods || 0)))),
    instMonthly: String(Math.round(Number(pchomeInst?.monthly || 0))),
    instNextDue: pchomeInst?.nextDue || "",
  });

  const add = () => {
    const amt = parseFloat(f.amount);
    if (!amt || amt <= 0) return;

    if (editId && kind !== "shared") {
      const old = d.tx.find((t) => t.id === editId);
      if (!old || old.kind === "payment" || old.kind === "loan_payment") return;
      // 先回沖舊帳對帳戶的影響，再套用修改後的新帳。刷卡本來就不動銀行餘額。
      let cash2 = adjust(d.cash, old.method, old.kind === "income" ? -Number(old.amount || 0) : Number(old.amount || 0));
      cash2 = adjust(cash2, f.method, kind === "income" ? amt : -amt);
      const updated = { ...old, kind, amount: amt, cat: f.cat, method: f.method, date: f.date, note: f.note };
      save({ ...d, cash: cash2, tx: d.tx.map((t) => t.id === editId ? updated : t) });
    } else {
      const delta = kind === "income" ? amt : -amt;
      const cash2 = adjust(d.cash, f.method, delta);
      if (kind === "shared") {
        save({ ...d, cash: cash2, sharedTx: [{ id: "s" + Date.now(), amount: amt, cat: f.cat, method: f.method, date: f.date, note: f.note, settled: false, settledAmount: 0 }, ...(d.sharedTx || [])] });
      } else {
        save({ ...d, cash: cash2, tx: [{ id: "t" + Date.now(), kind, amount: amt, cat: f.cat, method: f.method, date: f.date, note: f.note }, ...d.tx] });
      }
    }
    setEditId(null);
    setF({ ...f, amount: "", note: "" });
    setSheet(false);
  };

  const editTx = (t) => {
    if (!t || t.kind === "payment" || t.kind === "loan_payment") return;
    setEditId(t.id);
    setKind(t.kind);
    setF({ amount: String(t.amount || ""), cat: t.cat || (t.kind === "income" ? "base" : "other"), method: t.method || "c1", date: t.date || today(), note: t.note || "" });
    setSheet(true);
  };

  const runTransfer = () => {
    if (!modal || modal.type !== "move") return;
    const from = transferAcct(modal.from), to = transferAcct(modal.to);
    if (!from || !to || from.id === to.id) return;
    const sent = parseFloat(modal.fromAmount);
    if (!(sent > 0)) return;
    const sameTWD = from.unit === "TWD" && to.unit === "TWD";
    const received = sameTWD ? sent : parseFloat(modal.toAmount);
    if (!(received > 0)) return;

    let cash = d.cash.map((c) => {
      let amt = Number(c.amt || 0);
      if (c.id === from.id) amt -= sent;
      if (c.id === to.id) amt += received;
      return amt === Number(c.amt || 0) ? c : { ...c, amt };
    });
    let exchanges = (d.exchanges || []).map((x) => {
      let u = Number(x.u || 0);
      if (x.id === from.id) u -= sent;
      if (x.id === to.id) u += received;
      return u === Number(x.u || 0) ? x : { ...x, u };
    });

    const cross = from.unit !== to.unit;
    const uAmount = from.unit === "U" ? sent : to.unit === "U" ? received : 0;
    const twdAmount = from.unit === "TWD" ? sent : to.unit === "TWD" ? received : 0;
    const rate = cross && uAmount > 0 ? twdAmount / uAmount : null;
    const feeU = from.unit === "U" && to.unit === "U" ? Math.max(0, sent - received) : 0;
    const item = {
      id: "x" + Date.now(), date: modal.date || today(), from: from.id, to: to.id,
      fromAmount: sent, toAmount: received, fromUnit: from.unit, toUnit: to.unit,
      feeU, rate, note: (modal.note || "").trim(),
    };
    save({ ...d, cash, exchanges, transfers: [item, ...(d.transfers || [])] });
    setModal(null);
  };

  const reverseTransfer = (t) => {
    const sent = Number(t.fromAmount || 0), received = Number(t.toAmount || 0);
    const cash = d.cash.map((c) => {
      let amt = Number(c.amt || 0);
      if (c.id === t.from) amt += sent;
      if (c.id === t.to) amt -= received;
      return amt === Number(c.amt || 0) ? c : { ...c, amt };
    });
    const exchanges = (d.exchanges || []).map((x) => {
      let u = Number(x.u || 0);
      if (x.id === t.from) u += sent;
      if (x.id === t.to) u -= received;
      return u === Number(x.u || 0) ? x : { ...x, u };
    });
    save({ ...d, cash, exchanges, transfers: (d.transfers || []).filter((x) => x.id !== t.id) });
  };

  const settleShared = (list, amount) => {
    let left = Math.max(0, Number(amount || 0));
    const updates = new Map();
    [...(list || [])]
      .filter((t) => sharedRemaining(t) > 0.001)
      .sort((a, b) => a.date.localeCompare(b.date) || String(a.id).localeCompare(String(b.id)))
      .forEach((t) => {
        if (left <= 0.001) return;
        const rem = sharedRemaining(t);
        const pay = Math.min(rem, left);
        const paid = sharedSettledAmount(t) + pay;
        const full = paid >= Number(t.amount || 0) - 0.001;
        updates.set(t.id, { ...t, settledAmount: paid, settled: full, settledDate: full ? today() : t.settledDate });
        left -= pay;
      });
    return (list || []).map((t) => updates.get(t.id) || t);
  };

  const deleteTx = (t) => {
    if (!t) return;
    if (t.kind === "loan_payment") {
      const periods = Math.max(1, Number(t.periodsPaid || 1));
      const cash = d.cash.map((c) => c.id === t.payFrom ? { ...c, amt: Number(c.amt || 0) + Number(t.amount || 0) } : c);
      const loans = d.loans.map((x) => {
        if (x.id !== t.loanId) return x;
        const restoredAmt = Math.min(Number(x.originalAmt || Infinity), Number(x.amt || 0) + Number(t.amount || 0));
        const restoredDue = x.nextDue ? addMonthsYMD(x.nextDue, -periods, x.dueDay || 10) : addMonthsYMD(t.date || today(), 0, x.dueDay || 10);
        return { ...x, amt: restoredAmt, remainingPeriods: Number(x.remainingPeriods || 0) + periods, nextDue: restoredDue };
      });
      save({ ...d, cash, loans, tx: d.tx.filter((x) => x.id !== t.id) });
      return;
    }
    if (t.kind === "payment") {
      const cash = d.cash.map((c) => c.id === (t.payFrom || "c3") ? { ...c, amt: Number(c.amt || 0) + Number(t.amount || 0) } : c);
      const instAmt = paymentInstallmentAmount(t);
      const loans = instAmt > 0 ? d.loans.map((x) => {
        const target = x.id === (t.installmentLoanId || "l2");
        if (!target) return x;
        const monthly = Number(x.monthly || 1180);
        const periods = Math.max(1, Number(t.installmentPeriodsPaid || Math.ceil(instAmt / (monthly || 1))));
        const restoredAmt = Math.min(Number(x.originalAmt || Infinity), Number(x.amt || 0) + instAmt);
        const restoredDue = x.nextDue ? addMonthsYMD(x.nextDue, -periods, x.dueDay || 22) : addMonthsYMD(t.date || today(), 0, x.dueDay || 22);
        return {
          ...x, amt: restoredAmt,
          dueNow: Math.min(monthly, restoredAmt),
          remainingPeriods: Number(x.remainingPeriods || 0) + periods,
          nextDue: restoredDue,
        };
      }) : d.loans;
      save({ ...d, cash, loans, tx: d.tx.filter((x) => x.id !== t.id) });
      return;
    }
    save({ ...d,
      cash: adjust(d.cash, t.method, t.kind === "income" ? -Number(t.amount || 0) : Number(t.amount || 0)),
      tx: d.tx.filter((x) => x.id !== t.id),
    });
  };

  useEffect(() => {
    if (!loaded) return;
    const t = today();
    const debtNow = loanTWD + totalDue;
    const list = d.snaps || [];
    const i = list.findIndex((x) => x.date === t);
    const same = i >= 0 && Math.abs(list[i].net - net) < 1 && Math.abs(list[i].debt - debtNow) < 1;
    if (same) return;
    const next = i >= 0 ? list.map((x, j) => (j === i ? { date: t, net, debt: debtNow } : x)) : [...list, { date: t, net, debt: debtNow }];
    save({ ...d, snaps: next.slice(-90) });
  }, [loaded, net, loanTWD, totalDue]);

  const S = {
    card: { background: C.card, border: `1px solid ${C.line}`, borderRadius: 18, marginBottom: 12, boxShadow: "0 10px 30px rgba(0,0,0,.16)" },
    lbl: { fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif", fontWeight: 750, fontSize: 12, letterSpacing: "0.045em", color: C.dim },
    inp: { background: C.soft, border: `1px solid ${C.line}`, borderRadius: 12, color: C.text, fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif", fontWeight: 600, fontSize: 15, padding: "13px 14px", width: "100%", outline: "none" },
    chip: (on, col) => ({ background: on ? col : C.soft, border: `1px solid ${on ? col : C.line}`, borderRadius: 999, color: on ? "#fff" : C.text, fontWeight: 700, fontSize: 13.5, padding: "9px 14px", cursor: "pointer", fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif" }),
    row: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 0", borderTop: `1px solid ${C.line}`, gap: 10 },
    sub: { fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif", fontWeight: 550, fontSize: 11.5, color: C.dim, marginTop: 4 },
  };

  if (!loaded) return <div style={{ background: C.bg, minHeight: "100vh", padding: 40, color: C.dim, fontFamily: "monospace" }}>載入中…</div>;

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, padding: "calc(env(safe-area-inset-top) + 14px) 14px 112px" }}>
      {quickMsg && (
        <div style={{ position: "fixed", top: "calc(env(safe-area-inset-top) + 10px)", left: "50%", transform: "translateX(-50%)", zIndex: 60, width: "calc(100% - 26px)", maxWidth: 434, background: C.ink, color: "#fff", borderRadius: 10, padding: "12px 14px", fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif", fontSize: 12.5, boxShadow: "0 8px 24px rgba(0,0,0,.14)" }}>
          {quickMsg}
        </div>
      )}
      <style>{`
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body,#root{background:${C.bg};color:${C.text}}
        body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif;font-weight:560}
        button,input,textarea{font:inherit}
        button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid ${C.ink};outline-offset:2px}
        ::placeholder{color:#68717D}
        input[type=date]{color-scheme:dark}
        *{font-variant-numeric:tabular-nums}
      `}</style>

      <div style={{ maxWidth: 480, margin: "0 auto", fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif" }}>
        {/* TABS */}
        <div style={{ display: "flex", gap: 8, marginBottom: 16, padding: 4, background: C.card, border: `1px solid ${C.line}`, borderRadius: 16 }}>
          <button onClick={() => setTab("ledger")} style={{ ...S.chip(tab === "ledger", C.ink), flex: 1, borderRadius: 12, padding: "11px", border: "none" }}>記帳</button>
          <button onClick={() => setTab("shared")} style={{ ...S.chip(tab === "shared", C.purple), flex: 1, borderRadius: 12, padding: "11px", border: "none" }}>共同</button>
          <button onClick={() => setTab("assets")} style={{ ...S.chip(tab === "assets", C.ink), flex: 1, borderRadius: 12, padding: "11px", border: "none" }}>資產</button>
        </div>

        {tab === "ledger" && (<>
          <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 12 }}>
            {months.map((m) => <button key={m} onClick={() => setMonth(m)} style={S.chip(m === month, C.teal)}>{m.replace("-", "/")}</button>)}
          </div>

          <div style={{ ...S.card, padding: "15px 17px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
              <div style={S.lbl}>我的錢包</div>
              <button onClick={() => setTab("assets")} style={{ background: "none", border: "none", color: C.ink, fontWeight: 750, fontSize: 11.5, cursor: "pointer", padding: 0 }}>查看全部 →</button>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: 8 }}>
              {["c1", "c2", "c4"].map((id) => {
                const a = d.cash.find((x) => x.id === id);
                if (!a) return null;
                const shortName = id === "c2" ? "國泰" : a.name;
                return (
                  <div key={id} style={{ minWidth: 0, padding: "12px 10px", background: C.soft, border: `1px solid ${C.line}`, borderRadius: 13 }}>
                    <div style={{ fontSize: 11.5, color: C.dim, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{shortName}</div>
                    <div style={{ marginTop: 6, fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang TC','Noto Sans TC',sans-serif", fontSize: 20, lineHeight: 1.05, fontWeight: 850, letterSpacing: "-0.02em", whiteSpace: "nowrap" }}>{nf(a.amt)}</div>
                  </div>
                );
              })}
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.line}` }}>
              <div>
                <div style={{ fontSize: 11.5, color: C.dim, fontWeight: 700 }}>可流動資產</div>
                <div style={{ marginTop: 3, fontSize: 10.5, color: C.dim }}>現金 + 國泰 + 玉山</div>
              </div>
              <div style={{ fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang TC','Noto Sans TC',sans-serif", fontSize: 24, lineHeight: 1, fontWeight: 900, letterSpacing: "-0.025em", color: C.text, whiteSpace: "nowrap" }}>
                {nf(["c1", "c2", "c4"].reduce((sum, id) => sum + Number(d.cash.find((x) => x.id === id)?.amt || 0), 0))}
              </div>
            </div>
          </div>

          <div style={{ ...S.card, padding: "18px 17px" }}>
            <div style={S.lbl}>本月支出</div>
            <div style={{ fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang TC','Noto Sans TC',sans-serif", fontWeight: 800, fontSize: 42, lineHeight: 1.1, marginTop: 3, color: C.out }}>{nf(spent)}</div>
            <div style={{ display: "flex", gap: 22, marginTop: 14, paddingTop: 13, borderTop: `1px solid ${C.line}` }}>
              <div><div style={{ color: C.dim, fontSize: 10.5 }}>收入</div><div style={{ color: C.inc, fontSize: 16, marginTop: 2 }}>{nf(earned)}</div></div>
              <div><div style={{ color: C.dim, fontSize: 10.5 }}>結餘</div><div style={{ color: earned - spent >= 0 ? C.inc : C.out, fontSize: 16, marginTop: 2 }}>{earned - spent >= 0 ? "+" : ""}{nf(earned - spent)}</div></div>
              <div><div style={{ color: C.dim, fontSize: 10.5 }}>固定月付</div><div style={{ color: C.dim, fontSize: 16, marginTop: 2 }}>{nf(fixedOut)}</div></div>
            </div>
          </div>

          <div style={{ ...S.card, padding: "15px 17px", borderColor: gap > 0 ? C.amber : C.line }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
              <div style={S.lbl}>應付卡費</div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <button onClick={openDebtEditor} style={{ ...S.chip(false, C.ink), padding: "6px 9px", borderRadius: 8, fontSize: 11.5 }}>調整</button>
                <div style={{ fontSize: 19, color: C.amber }}>{nf(totalDue)}</div>
              </div>
            </div>
            <div style={{ marginTop: 10, fontSize: 12, color: C.dim, lineHeight: 1.9 }}>
              國泰卡 {nf(payableCard("c_cathay"))} · 每月 <b style={{ color: C.text }}>22</b> 號繳
              <span style={{ color: C.dim }}>（一般 {nf(Math.max(0, due("c_cathay")))} + 本期分期 {nf(cardInstDue("c_cathay"))}）</span>
              <br />富邦卡 {nf(payableCard("c_fubon"))} · 每月 <b style={{ color: C.text }}>4</b> 號繳
              {pchomeInst && <><br />PCHOME 分期餘 <span style={{ color: C.text }}>{nf(pchomeInst.amt)}</span> · 剩 <span style={{ color: C.text }}>{nf(pchomeInst.remainingPeriods)}</span> 期
                · {cardInstDue("c_cathay") > 0 ? "本期" : "下期預列"} {nf(Math.min(Number(pchomeInst.monthly || 0), Number(pchomeInst.amt || 0)))} / {md(pchomeInst.nextDue)}</>}
              <br />卡費帳戶 {nf(payAcct?.amt || 0)} · 準備金目標 {nf(cardReserveTarget)}
            </div>
            {gap > 0 && <div style={{ marginTop: 10, padding: "10px 12px", background: "#241D10", borderRadius: 12, fontSize: 12.5, color: "#F1C86C" }}>卡費準備金尚缺 <b>{nf(gap)}</b>{nextInstallmentReserve > 0 ? ` · 已把下期分期 ${nf(nextInstallmentReserve)} 預留進去` : ""}</div>}
            <div style={{ display: "flex", gap: 7, marginTop: 11 }}>
              <button onClick={() => setModal({ type: "transfer", amount: String(gap > 0 ? Math.round(gap) : 0), from: d.cash.find((c) => !c.earmark && !c.excluded && c.cur === "TWD")?.id })}
                style={{ ...S.chip(false, C.ink), flex: 1, borderRadius: 8, padding: "10px" }}>轉入</button>
              <button disabled={!(totalDue > 0)} onClick={() => setModal({ type: "pay", card: payableCard("c_cathay") > 0 ? "c_cathay" : "c_fubon", amount: String(Math.round(payableCard("c_cathay") > 0 ? payableCard("c_cathay") : payableCard("c_fubon"))), from: "c3" })}
                style={{ ...S.chip(false, C.ink), flex: 1, borderRadius: 8, padding: "10px", opacity: totalDue > 0 ? 1 : .5 }}>{totalDue > 0 ? "繳卡費" : "本期已繳"}</button>
            </div>
          </div>

          {personalLoan && (
            <div style={{ ...S.card, padding: "15px 17px", borderColor: loanDueNow > 0 ? C.teal : C.line }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                <div style={S.lbl}>信貸還款</div>
                <div style={{ fontSize: 19, color: loanDueNow > 0 ? C.teal : C.text }}>{nf(personalLoan.amt)}</div>
              </div>
              <div style={{ marginTop: 10, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <div style={{ padding: "10px 11px", background: C.soft, borderRadius: 11 }}>
                  <div style={S.sub}>每月還款</div>
                  <div style={{ marginTop: 3, fontSize: 17, fontWeight: 850 }}>{nf(personalLoan.monthly)}</div>
                </div>
                <div style={{ padding: "10px 11px", background: C.soft, borderRadius: 11 }}>
                  <div style={S.sub}>剩餘期數</div>
                  <div style={{ marginTop: 3, fontSize: 17, fontWeight: 850 }}>{nf(personalLoan.remainingPeriods)} 期</div>
                </div>
              </div>
              <div style={{ marginTop: 10, fontSize: 12, color: C.dim, lineHeight: 1.8 }}>
                每月 <b style={{ color: C.text }}>10</b> 號繳 · {loanDueNow > 0 ? <>本期應繳 <span style={{ color: C.teal, fontWeight: 850 }}>{nf(loanDueNow)}</span></> : <>下一期 <span style={{ color: C.text }}>{md(personalLoan.nextDue)}</span> · {nf(Math.min(Number(personalLoan.monthly || 0), Number(personalLoan.amt || 0)))}</>}
              </div>
              <button disabled={!(loanDueNow > 0)} onClick={() => setModal({ type: "loanPay", loanId: personalLoan.id, amount: String(Math.round(Math.min(Number(personalLoan.monthly || 0), Number(personalLoan.amt || 0)))), from: "c2" })}
                style={{ ...S.chip(loanDueNow > 0, C.teal), width: "100%", borderRadius: 9, padding: "11px", marginTop: 11, opacity: loanDueNow > 0 ? 1 : .55 }}>
                {loanDueNow > 0 ? "繳信貸" : "本期已繳"}
              </button>
            </div>
          )}

                  const periodsPaid = oneTerm > 0 ? 1 : 0;
                  const nextDue = newAmt > 0 ? addMonthsYMD(personalLoan.nextDue || today(), periodsPaid, personalLoan.dueDay || 10) : null;

                  });

              <input placeholder="備註" value={f.note} onChange={(e) => setF({ ...f, note: e.target.value })} style={S.inp} />
            </div>
            <button onClick={add} style={{ width: "100%", background: kind === "income" ? C.inc : C.out, border: "none", borderRadius: 10, color: "#fff", fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Noto Sans TC',sans-serif", fontSize: 15, fontWeight: 850, padding: "14px", cursor: "pointer" }}>{editId ? "儲存修改" : "存下來"}</button>
          </div>
        </div>
      )}
    </div>
  );
}


// 元件內的執行期錯誤也攔下來顯示
class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) {
    showErr("畫面出錯了", (err && err.message) + "\n\n" + ((info && info.componentStack) || "").slice(0, 500));
  }
  render() { return this.state.err ? null : this.props.children; }
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(
    <Boundary><App /></Boundary>
  );
} catch (e) {
  showErr("啟動失敗", (e && e.message) + "\n\n" + ((e && e.stack) || "").slice(0, 600));
}
}
</script>

if ("serviceWorker" in navigator) {

}
</script>
